name: CI/CD auf AWS EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktions-Build erstellen
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_IMGS: ${{ vars.VITE_IMGS || 'items' }}

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      REMOTE_TMP: /home/ec2-user/deploy
      WEB_ROOT: /var/www/biztrips
    steps:
      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: prepare SSH-key
        run: |
          test -n $EC2_SSH_KEY  || { echo "EC2_SSH_KEY is not set"; exit 1; }
          test -n $EC2_HOST || { echo "EC2_HOST is not set"; exit 1; }
          test -n $EC2_USER || { echo "EC2_USER is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cp "$EC2_SSH_KEY" ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh "$EC2_USER@$EC2_HOST" true

      - name: sync build to EC2
        run: rsync -az --delete dist/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/deploy/"

      - name: deploy to EC2
        run: ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo rsync -a --delete /home/ec2-user/deploy/ /var/www/biztrips/ && sudo systemctl reload nginx"

      - name: delete SSH-key
        if: always()
        run: rm -f ~/.ssh/deploy_key