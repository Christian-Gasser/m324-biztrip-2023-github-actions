name: CI/CD to  Docker Hub and AWS ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktions-Build erstellen
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_IMGS: ${{ vars.VITE_IMGS || 'items' }}

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE: "${{ secrets.DOCKERHUB_USER }}"/biztrips
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo "DOCKERHUB_TOKEN is not set"; exit 1; }
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Build Docker Image
        run: |
          docker build --build-arg REACT_APP_API_BASE_URL="$REACT_APP_API_BASE_URL" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" .

      - name: Push Docker Image
        run: |
          docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
          docker push "$IMAGE:latest"

      - name: Log out from Docker Hub
        run: docker logout
